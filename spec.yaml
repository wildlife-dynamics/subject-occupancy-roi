id: subject_occupancy_roi
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.4
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-ste
  version: ==0.0.24
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: ecoscope-workflows-ext-mep
  version: ==1.10.7
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

rjsf-overrides:
  properties:
    # Turn the free-text subject group field into a drop-down of the chosen
    # EarthRanger site's subject group names.
    subjectgroup_observations.properties.subject_group_name:
      title: Subject Group Name
      type: string
      description: >-
        The EarthRanger subject group whose home ranges are measured, picked from the chosen data
        source's subject groups. ⚠️ The use of a group with mixed subtypes could lead to unexpected results.
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_connection.properties.data_source.properties.name

    # Groupers: the Category option can only group by subject name; the Time and Spatial options are kept.
    groupers.properties.groupers.items.anyOf:
    - type: object
      title: Category
      properties:
        index_name:
          title: Category
          type: string
          oneOf:
          - const: extra__name
            title: Subject Name
          default: extra__name
      required:
      - index_name
    - $ref: '#/$defs/TemporalGrouper'
    - $ref: '#/$defs/SpatialGrouper'

    # Regions: which EarthRanger features to measure occupancy in and draw on the map.
    # Don't add `additionalProperties: false` to the options below: Ecoscope Desktop validates with AJV's
    # removeAdditional, which would then wipe the list while the form works out the selected option.
    earthranger_features.title: Regions
    earthranger_features.description: >-
      The EarthRanger features (e.g. conservancies, parks or blocks) to measure each subject's
      occupancy in. They are also drawn on the map. Only polygons are measured; lines and points
      are drawn but skipped in the occupancy table.
    earthranger_features.properties.selection.title: Select regions by
    earthranger_features.properties.selection.description: >-
      Choose how to pick the regions: whole feature sets, feature types, or individual features by ID.
      Names must match EarthRanger exactly, including capitals.
    earthranger_features.properties.selection.default:
      feature_set_names: []
    earthranger_features.properties.selection.anyOf:
    - type: object
      title: Feature sets
      properties:
        feature_set_names:
          title: Feature set names
          type: array
          items:
            type: string
          description: >-
            EarthRanger feature sets to use, e.g. Boundaries. Every feature in each set becomes a
            region. Leave empty to use every feature set on the site.
    - type: object
      title: Feature types
      required:
      - feature_type_names
      properties:
        feature_type_names:
          title: Feature type names
          type: array
          minItems: 1
          items:
            type: string
          description: >-
            EarthRanger feature types to use, e.g. Conservancy or Park. Every feature of these types
            becomes a region, whichever feature set it is in.
    - type: object
      title: Feature IDs
      required:
      - feature_ids
      properties:
        feature_ids:
          title: Feature IDs
          type: array
          minItems: 1
          items:
            type: string
          description: >-
            IDs of individual EarthRanger features to use, as shown in the feature's URL in
            EarthRanger.

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Groupers
  id: groupers
  task: set_groupers

- name: Set Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y %H:%M:%S'

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Basemap URLs
  id: base_maps_pydeck
  task: set_base_maps

- name: Get Features
  id: earthranger_features
  task: get_features
  partial:
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: false

- name: Subject Group Name
  id: subjectgroup_observations
  task: get_subjectgroup_observations
  partial:
    time_range: ${{ workflow.time_range.return }}
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false

- name: Convert Crs
  id: convert_er_features_mercator
  task: convert_crs
  partial:
    df: ${{ workflow.earthranger_features.return }}
    crs: EPSG:3857

- name: Process Relocations
  id: relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.subjectgroup_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - groupby_col
    - fixtime
    - junk_status
    - geometry
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__created_at
    - extra__subject__subject_subtype

- name: Style Spatial Features
  id: spatial_features_styled
  task: style_spatial_features
  partial:
    client: ${{ workflow.er_connection.return }}
    features: ${{ workflow.earthranger_features.return }}
    legend_title: Map Layers
    style: []
    group_by: feature_type

- name: Relocations To Trajectory
  id: to_trajectory
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.relocations.return }}

- name: Create Spatial Features Layer
  id: spatial_features_layer
  task: ecoscope_workflows_ext_ste.tasks.results.create_spatial_features_layer
  partial:
    geodataframes:
    - ${{ workflow.spatial_features_styled.return }}

- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.to_trajectory.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Calculate Elliptical Time Density Grouped
  id: grouped_etd
  task: calculate_elliptical_time_density_grouped
  partial:
    groupby_cols:
    - extra__name
    percentiles:
    - 50
    - 60
    - 70
    - 80
    - 90
    - 95
    - 99.9
    cell_size:
      auto_scale_or_custom: Auto-scale
    drop_null_groups: true
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.groups.return }}

- name: Filter Rows
  id: filter_percentile_rows
  task: filter_rows
  partial:
    column_name: percentile
    op: gt
    value: 95
    reset_index: false
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.grouped_etd.return }}

- name: Convert Crs
  id: etd_projected
  task: convert_crs
  partial:
    crs: EPSG:4326
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.grouped_etd.return }}

- name: Compute View State From Gdf
  id: view_state_from_gdf
  task: compute_view_state_from_gdf
  partial:
    max_zoom: 13
    pitch: 0
    bearing: 0
  mapvalues:
    argnames:
    - gdf
    argvalues: ${{ workflow.grouped_etd.return }}

- name: Apply Color Map
  id: percentile_color_map
  task: apply_color_map
  partial:
    input_column_name: percentile
    colormap: RdYlGn
    output_column_name: percentile_colors
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.etd_projected.return }}

- name: Compute Region Occupancy
  id: region_occupancy
  task: compute_region_occupancy
  partial:
    regions_gdf: ${{ workflow.convert_er_features_mercator.return }}
    subject_column: extra__name
    region_column: null
    percentile: 99.9
  mapvalues:
    argnames:
    - etd_gdf
    argvalues: ${{ workflow.filter_percentile_rows.return }}

- name: Filter Rows
  id: exclude_null_values
  task: filter_rows
  partial:
    column_name: area_sqkm
    op: gt
    value: 0
    reset_index: true
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.region_occupancy.return }}

- name: Create Geojson Layer
  id: geojson_layer
  task: create_geojson_layer
  partial:
    tooltip_columns: 
      - percentile 
      - percentile_colors
    layer_style:
      auto_highlight: false
      opacity: 0.225
      pickable: true
      filled: true
      stroked: true
      extruded: false
      wireframe: false
      get_fill_color: percentile_colors
      get_line_color: '[0, 0, 0]'
      get_line_width: 0.35
      get_elevation: null
      get_point_radius: 1
      line_width_units: pixels
      line_width_scale: 1
      line_width_min_pixels: 0
      line_width_max_pixels: null
      line_miter_limit: 4
      line_joint_rounded: false
      elevation_scale: 1
      point_radius_units: pixels
      point_radius_scale: 1
      point_radius_min_pixels: 0
      point_radius_max_pixels: null
      billboard: false
    legend:
      title: Home Range
      label_column: percentile
      color_column: percentile_colors
      sort: ascending
      label_suffix: null
    data_url: null
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.percentile_color_map.return }}

- name: Persist Df
  id: region_occupancy_df
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    filename: null
    filetype: csv
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.exclude_null_values.return }}

- name: Combine Deckgl Map Layers
  id: deckgl_map_layers
  task: combine_deckgl_map_layers
  partial:
    static_layers: ${{ workflow.spatial_features_layer.return }}
  mapvalues:
    argnames:
    - grouped_layers
    argvalues: ${{ workflow.geojson_layer.return }}

- name: Map Columns
  id: map_occupancy_columns
  task: map_columns
  partial:
    rename_columns:
      extra__name: Subject Name
      region_area_sqkm: Region Area (km²)
      area_sqkm: Area Covered (km²)
      occupancy_pct: Occupancy (%)
    drop_columns: []
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix
  mapvalues:
    argnames:
    - df
    argvalues: ${{ workflow.exclude_null_values.return }}

- name: Draw Table
  id: region_occupancy_table
  task: draw_table
  partial:
    columns: null
    table_config: null
  mapvalues:
    argnames:
    - dataframe
    argvalues: ${{ workflow.map_occupancy_columns.return }}

- name: Groupbykey
  id: groupbykey_step
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.view_state_from_gdf.return }}
    - ${{ workflow.deckgl_map_layers.return }}

- name: Persist Text
  id: persist_occupancy_table
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.region_occupancy_table.return }}

- name: Draw Map
  id: occupancy_map
  task: draw_map
  partial:
    output_type: html
    tile_layers: ${{ workflow.base_maps_pydeck.return }}
    static: false
    title: null
    legend_style:
      placement: bottom-right
    max_zoom: 20
  mapvalues:
    argnames:
    - view_state
    - geo_layers
    argvalues: ${{ workflow.groupbykey_step.return }}

- name: Create Table Widget Single View
  id: occupancy_table_widget
  task: create_table_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Occupancy
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.persist_occupancy_table.return }}

- name: Persist Text
  id: map_occupancy_text
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.occupancy_map.return }}

- name: Merge Widget Views
  id: occupancy_widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.occupancy_table_widget.return }}

- name: Create Map Widget Single View
  id: map_occupancy_widget_view
  task: create_map_widget_single_view
  skipif:
    conditions:
    - never
  partial:
    title: Home Range Map
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.map_occupancy_text.return }}

- name: Merge Widget Views
  id: map_occupancy_widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.map_occupancy_widget_view.return }}

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    widgets:
    - ${{ workflow.map_occupancy_widget_views.return }}
    - ${{ workflow.occupancy_widget_views.return }}
    details: ${{ workflow.workflow_details.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
